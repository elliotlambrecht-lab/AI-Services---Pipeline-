<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pipeline</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#faf9f6; color:#1c1c1a; font:15px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  form { background:#fff; border:1px solid #e4e2dc; border-radius:10px; padding:24px; width:min(340px, 90vw); }
  h1 { font-size:18px; margin:0 0 14px; }
  input { width:100%; box-sizing:border-box; padding:10px; font:inherit; border:1px solid #c9c6bd; border-radius:6px; }
  button { margin-top:10px; width:100%; padding:10px; font:inherit; font-weight:600; color:#fff; background:#1c1c1a; border:0; border-radius:6px; cursor:pointer; }
  p { color:#b3261e; margin:10px 0 0; min-height:1.4em; font-size:13px; }
</style>
</head>
<body>
<form id="f">
  <h1>Pipeline</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button>Open</button>
  <p id="msg"></p>
</form>
<script>
const BLOB = __BLOB__;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const norm = pw.replace(/[-\s]/g, "").toUpperCase();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(BLOB.salt), iterations:600000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(BLOB.iv) }, key, b64(BLOB.data));
  return new TextDecoder().decode(plain);
}
async function go(pw, quiet) {
  const msg = document.getElementById("msg");
  if (!quiet) msg.textContent = "Opening...";
  try {
    const html = await open(pw);
    try { sessionStorage.setItem("pl", pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem("pl"); } catch (e2) {}
    if (!quiet) msg.textContent = "Wrong password.";
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); go(document.getElementById("pw").value, false); });
try { const saved = sessionStorage.getItem("pl"); if (saved) go(saved, true); } catch (e) {}
</script>
</body>
</html>
