const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const norm = pw.replace(/[-\s]/g, "").toUpperCase();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(BLOB.salt), iterations:600000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(BLOB.iv) }, key, b64(BLOB.data));
  return new TextDecoder().decode(plain);
}
async function go(pw, quiet) {
  const msg = document.getElementById("msg");
  if (!quiet) msg.textContent = "Opening...";
  try {
    const html = await open(pw);
    try { sessionStorage.setItem("pl", pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem("pl"); } catch (e2) {}
    if (!quiet) msg.textContent = "Wrong password.";
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); go(document.getElementById("pw").value, false); });
try { const saved = sessionStorage.getItem("pl"); if (saved) go(saved, true); } catch (e) {}
